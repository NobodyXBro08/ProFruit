# API + web en Docker. MySQL del PC: npm run up:hostdb + .env (DB_HOST=host.docker.internal).
# Stack completo con MySQL en contenedor: npm run up (= incluye docker-compose.db.yml).

services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    container_name: profruit-api
    restart: unless-stopped
    ports: ["${API_PUBLISH_PORT:-3000}:3000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3000"
      MYSQLHOST: ${DB_HOST:-mysql}
      MYSQLPORT: ${DB_PORT:-3306}
      MYSQLUSER: ${DB_USER:-root}
      MYSQLPASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-profruit_root}}
      MYSQLDATABASE: ${DB_NAME:-${MYSQL_DATABASE:-profruit_db}}
      JWT_SECRET: ${JWT_SECRET:-profruit-dev-jwt-change-me}
      AUTH_SECRET: ${AUTH_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:8080,http://127.0.0.1:3001,http://127.0.0.1:8080}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # En Docker local el navegador habla con nginx (:8080), que proxya /api → backend.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    container_name: profruit-web
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-8080}:80"]
    depends_on: { backend: { condition: service_healthy } }
