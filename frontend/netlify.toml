# Netlify: en el panel, "Base directory" = frontend (si el repo es monorepo).
# Recomendado: REACT_APP_API_URL = URL absoluta del API (https://… o http://…, sin barra final). Si falta, el bundle usa el valor por defecto en src/config/api.js.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
