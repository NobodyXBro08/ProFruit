# Netlify: en el panel, "Base directory" = frontend (si el repo es monorepo).
# Opcional: REACT_APP_API_URL = URL del API (sin barra final). Si no se define, el build usa la API por defecto en Railway (ver src/config/api.js).

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
